# According to this convention :
# https://wiki.alice-bob.com/e/en/process/nanofab_design_review
# 
---
width: 10mm
length: 10mm
ports:
   RF:
      cpw_width: 680um
      cpw_gap: 240um
      locations:
         - [[-5mm, 0], 0] # 1 pos, ori
         - [[-5mm, 2.121mm], 0] # 2 pos, ori

         - [[-3.879mm, 5mm], -90] # 3 pos, ori
         - [[0, 5mm], -90] # 4 pos, ori

         - [[-5mm, -3.879mm], 0] # 5 pos, ori
         - [[2.121mm, 5mm], -90] # 6 pos, ori

         - [[-3.879mm, -5mm], 90] # 7 pos, ori
         - [[5mm, 2.121mm], 180] # 8 pos, ori

         - [[0, -5mm], 90] # 9 pos, ori
         - [[2.121mm, -5mm], 90] # 10 pos, ori

         - [[5mm, -3.879mm], 180] # 11 pos, ori
         - [[5mm, 0], 180] # 12 pos, ori
marker:
   bond:
      dim: 250e-6
      loc:
         - [1.75e-3, 0.25e-3]
         - [8.2e-3, 9.75e-3]
numbering: 1